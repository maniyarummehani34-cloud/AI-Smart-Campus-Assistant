<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1440" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07152b"/>
      <stop offset="52%" stop-color="#102b54"/>
      <stop offset="100%" stop-color="#1d4d8f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="78%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="22%" cy="76%" r="36%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e3a6d" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="720" fill="url(#sky)"/>
  <rect width="1440" height="720" fill="url(#glow1)"/>
  <rect width="1440" height="720" fill="url(#glow2)"/>
  <!-- Subtle architectural grid lines -->
  <g stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="140" x2="1440" y2="140"/>
    <line x1="0" y1="280" x2="1440" y2="280"/>
    <line x1="0" y1="420" x2="1440" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
  </g>
  <!-- Distant campus horizon silhouette -->
  <path d="M0 570 L180 510 L350 535 L580 490 L860 520 L1140 475 L1440 530 L1440 720 L0 720 Z" fill="#0b1f3d" opacity="0.65"/>
  <!-- Left academic wing -->
  <rect x="70" y="340" width="290" height="260" rx="10" fill="#0f294d" stroke="#60a5fa" stroke-opacity="0.22"/>
  <rect x="96" y="370" width="238" height="44" rx="4" fill="url(#glass)"/>
  <rect x="96" y="432" width="238" height="44" rx="4" fill="url(#glass)"/>
  <rect x="96" y="494" width="238" height="44" rx="4" fill="url(#glass)"/>
  <!-- Central modern glass library & clock dome -->
  <path d="M510 260 L720 185 L930 260 Z" fill="#163b6e" stroke="#93c5fd" stroke-opacity="0.32"/>
  <rect x="490" y="260" width="460" height="350" rx="14" fill="#102b52" stroke="#93c5fd" stroke-opacity="0.28"/>
  <rect x="530" y="295" width="380" height="230" rx="8" fill="url(#glass)" stroke="#bfdbfe" stroke-opacity="0.24"/>
  <!-- Architectural columns -->
  <g fill="#dbeafe" fill-opacity="0.18">
    <rect x="570" y="295" width="12" height="230"/>
    <rect x="650" y="295" width="12" height="230"/>
    <rect x="730" y="295" width="12" height="230"/>
    <rect x="810" y="295" width="12" height="230"/>
    <rect x="875" y="295" width="12" height="230"/>
  </g>
  <!-- Warm glowing library windows -->
  <g fill="#fde68a" fill-opacity="0.35">
    <rect x="594" y="325" width="44" height="24" rx="3"/>
    <rect x="674" y="325" width="44" height="24" rx="3"/>
    <rect x="754" y="375" width="44" height="24" rx="3"/>
    <rect x="674" y="425" width="44" height="24" rx="3"/>
    <rect x="594" y="425" width="44" height="24" rx="3"/>
    <rect x="828" y="375" width="38" height="24" rx="3"/>
  </g>
  <!-- Right innovation pavilion -->
  <rect x="1030" y="315" width="330" height="295" rx="12" fill="#0d2547" stroke="#60a5fa" stroke-opacity="0.24"/>
  <rect x="1062" y="350" width="266" height="52" rx="6" fill="url(#glass)"/>
  <rect x="1062" y="420" width="266" height="52" rx="6" fill="url(#glass)"/>
  <rect x="1062" y="490" width="266" height="52" rx="6" fill="url(#glass)"/>
  <!-- Campus plaza walkway -->
  <path d="M0 605 L1440 605 L1440 720 L0 720 Z" fill="#08172e"/>
  <path d="M620 605 L820 605 L950 720 L490 720 Z" fill="#1e4b87" opacity="0.45"/>
  <!-- Floating ambient data nodes -->
  <g stroke="#93c5fd" stroke-opacity="0.32" stroke-width="1.5">
    <line x1="210" y1="150" x2="360" y2="210"/>
    <line x1="360" y1="210" x2="480" y2="140"/>
    <line x1="1040" y1="160" x2="1190" y2="120"/>
    <line x1="1190" y1="120" x2="1290" y2="210"/>
  </g>
  <g fill="#bfdbfe">
    <circle cx="210" cy="150" r="5" opacity="0.65"/>
    <circle cx="360" cy="210" r="4" opacity="0.5"/>
    <circle cx="480" cy="140" r="5" opacity="0.6"/>
    <circle cx="1040" cy="160" r="5" opacity="0.65"/>
    <circle cx="1190" cy="120" r="6" opacity="0.75"/>
    <circle cx="1290" cy="210" r="4" opacity="0.5"/>
  </g>
</svg>
