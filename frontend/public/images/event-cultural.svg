  <ellipse cx="400" cy="365" rx="290" ry="42" fill="#0f2042" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="400" cy="245" r="36" fill="#fde68a" opacity="0.28"/>
