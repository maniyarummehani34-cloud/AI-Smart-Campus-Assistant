<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2947"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Athletics track rings -->
  <rect x="90" y="105" width="620" height="240" rx="120" stroke="#99f6e4" stroke-opacity="0.38" stroke-width="10"/>
  <rect x="130" y="140" width="540" height="170" rx="85" stroke="#bfdbfe" stroke-opacity="0.45" stroke-width="6"/>
  <rect x="170" y="175" width="460" height="100" rx="50" fill="#0b223a" fill-opacity="0.45" stroke="#5eead4" stroke-opacity="0.5" stroke-width="3"/>
  <!-- Center stadium emblem -->
  <circle cx="400" cy="225" r="34" fill="#2dd4bf" opacity="0.28" stroke="#ccfbf1" stroke-width="2"/>
  <line x1="400" y1="175" x2="400" y2="275" stroke="#ccfbf1" stroke-opacity="0.45" stroke-width="2"/>
</svg>
